<!DOCTYPE html>
<html data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landing page</title>
    <link rel="stylesheet" href="/static/styles.css" type="text/css">
</head>
<body>
    <script type="text/javascript" src="/static/client_session.js"></script>
    <section class="hero" style="padding: 61px 45px 45px;">
        <div class="eyebrow">Task results</div>
    </section>
    <section class="section">
        <div class="container">
            {% autoescape false %}
            {{html_graph_analysis_preliminary}}
            {% endautoescape %}
        </div>
    </section>
    <section class="section">
        <div class="container">
        <button id="resubmit">Resubmit task</button>
        <button id="more-analysis">Analyze further</button>
        <script>
            btn_resubmit = document.getElementById("resubmit")
            btn_resubmit.onclick = function () {
                _api_call("PUT","/api/task/{{ task_id }}", '{"status":"16"}').then(() => window.location.href = "/session")
            }
        </script>
        </div>
    </section>
        
</body>
</html>
