<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landing page</title>
    <link rel="stylesheet" href="/static/styles.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.4.0/min/dropzone.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.4.0/min/basic.min.css"/>
    <script type="application/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.4.0/min/dropzone.min.js"></script>
</head>
<body>
    <script type="text/javascript" src="/static/session.js"></script>
    <header class="hero">Lorem ipsum</header>
    <main>
        <div id="site-root">
            <h1 id="session-title"></h1>
            <h6 id="session-id">{{ uuid }}</h6>
        </div>
        <ul id="session-files">

        </ul>
        <p>Upload files:</p>
        <form method="POST" action="/api/session/{{ uuid }}" class="dropzone dz-clickable" id="dropper" enctype="multipart/form-data"></form>
        <script type="application/javascript">
            Dropzone.options.dropper = {
                paramName: 'file',
                chunking: true,
                forceChunking: true,
                url: '/api/session/{{ uuid }}',
                maxFilesize: 1025, // MB
                chunkSize: 1_000_000 // B
            }
        </script>
    </main>
    <footer class="site-footer">

    </footer>
    <script>
        window.onload = function() {
            build_page("{{ uuid }}");
        };
    </script>
</body>
</html>
