<!DOCTYPE html>
<html data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landing page</title>
    <link rel="stylesheet" href="/static/styles.css" type="text/css">
    <script type="text/javascript" src="/static/page_build.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA==" crossorigin="anonymous"></script>
    <script type="text/javascript" charset="utf-8">
        var socket = io();
        socket.on('update', (data) => {
            _update_badge(data.status, data.name, data.id);
        })
    </script>
</head>
<body>
    <main>
        <section class="hero" style="padding: 61px 45px 45px;">
            <div class="eyebrow">Browse through your sessions</div>
        </section>
        <section class="section">
            <div class="container">
            <a class="button button-primary" id="initSession">Create new session</a>
            <script>
            document.getElementById('initSession').onclick = function () {
                api_post_new_client_session().then(client_sessions_build_session_list);
            };
            </script>
            <div style="float:left;clear:none;padding:2% 2% 0px 2%;width:100%">
            <div id="file-session-list" style="float:left;width:60%;padding:2% 2% 0px 2%;">
            </div>
            <div id="task-session-list" style="float:right;width:40%;padding:2% 2% 0px 2%;">
            </div>
        </div>
            </div>
        </div>
        </section>
    </main>
    <footer class="site-footer">
    </footer>
    <script>
        client_sessions_build_session_list();
    </script>
</body>
</html>
