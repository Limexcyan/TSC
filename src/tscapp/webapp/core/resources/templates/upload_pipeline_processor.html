<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landing page</title>
    <link rel="stylesheet" href="/static/styles.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.4.0/min/dropzone.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.4.0/min/basic.min.css"/>
    <script type="application/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.4.0/min/dropzone.min.js"></script>
</head>
<body>
    <header class="hero">Browse through your files</header>
    <main>
        <form method="POST" action="/upload" class="dropzone dz-clickable" id="dropper" enctype="multipart/form-data"></form>
        <script type="application/javascript">
            Dropzone.options.dropper = {
                paramName: 'file',
                chunking: true,
                forceChunking: true,
                url: '/upload',
                maxFilesize: 1025, // MB
                chunkSize: 1_000_000 // B
            }
        </script>
    </main>
    <footer class="site-footer">
    </footer>
</body>
</html>
