<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landing page</title>
    <link rel="stylesheet" href="/static/styles.css" type="text/css">
</head>
<body>
    <script type="text/javascript" src="/static/session.js"></script>
    <header class="hero">Browse through your files</header>
    <main>
        <button id="initSession">Create new session</button>
        <script>
            document.getElementById('initSession').onclick = function () {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "api/session", true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.send("{}");
                xhr.onload = function () {
                    location.href = '/session/' + xhr.responseText;
                };
            };
        </script>
        <div id="session-list">

        </div>
    </main>
    <footer class="site-footer">
    </footer>
    <script>
        window.onload = function() {
            build_list();
        };
    </script>
</body>
</html>
