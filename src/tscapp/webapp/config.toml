[orchestrator]

appdata_path = 'src\\tscapp\\webapp\\appdata'
database_path = 'src\\tscapp\\webapp\\appdata\\db.db'
worker_count = 2

[webapp]

file_path = 'src\\tscapp\\webapp\\appdata\\files'

[flask]

# ============
# these are default flask configuration variables
# change them at will
# ============

DEBUG=true
TESTING=false
# PROPAGATE_EXCEPTIONS=None
TRAP_HTTP_EXCEPTIONS=false
# TRAP_BAD_REQUEST_ERRORS=None
# SECRET_KEY=None
# SECRET_KEY_FALLBACKS=None
SESSION_COOKIE_NAME='session'
# SESSION_COOKIE_DOMAIN=None
# SESSION_COOKIE_PATH=None
SESSION_COOKIE_HTTPONLY=true
SESSION_COOKIE_SECURE=false
SESSION_COOKIE_PARTITIONED=false
# SESSION_COOKIE_SAMESITE=None
SESSION_PERMAMENT=true
SESSION_TYPE='filesystem' # if deploying locally this is fine, change this if in production
PERMAMENT_SESSION_LIFETIME=2678400
SESSION_REFRESH_EACH_REQUEST=true
USE_X_SENDFILE=false
# SEND_FILE_MAX_AGE_DEFAULT=None
# TRUSTED_HOSTS=None
# SERVER_NAME=None
APPLICATION_ROOT='/'
PREFERRED_URL_SCHEME='http'
# MAX_CONTENT_LENGTH=None
MAX_FORM_MEMORY_SIZE=500000
MAX_FORM_PARTS=1000
TEMPLATES_AUTO_RELOAD=true
EXPLAIN_TEMPLATE_LOADING=false
MAX_COOKIE_SIZE=4093


