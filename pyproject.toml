[project]
name = "tscapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateusz Wojewodzic", email = "34684214+Sulphur0@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-session>=0.8.0",
    "flask-socketio>=5.6.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rdkit>=2026.3.5",
    "scikit-learn>=1.9.0",
]

[project.scripts]
tscapp = "tscapp:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 79