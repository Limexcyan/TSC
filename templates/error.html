<body>
{% if code404 %}
<h1>404</h1>

<h1>410</h1>
<p>The resource you're attempting to view does not exist anymore.</p>
{% endif %}

<h1>500</h1>
<p>The server ran into an error.</p>
{% endif %}
<p></p>
</body>
</html>
